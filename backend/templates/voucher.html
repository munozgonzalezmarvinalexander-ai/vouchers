<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Voucher {{ numero }}</title>
<style>
  @page { size: 216mm 279mm; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1f3a73; }

  /* Anclado al fondo de la hoja, crece hacia arriba. Tamaño y espacios vienen
     de la Configuración de impresión (ajustables y guardados). TODO en mayúsculas. */
  .voucher {
    position: fixed; left: 0; right: 0; bottom: {{ mb }};
    padding: 0 {{ ml }};
    font-size: {{ fs }};
    text-transform: uppercase;
  }

  .concepto { text-align: center; line-height: 1.5; margin: 0 0 {{ g_concepto }}; padding: 0 6mm; }

  table.lineas { width: 100%; border-collapse: collapse; }
  table.lineas td { padding: 0.18em 0; vertical-align: top; }
  td.cod { width: 24mm; white-space: nowrap; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.debe, td.haber { width: 28mm; }
  tr.banco td { padding-top: 0.9em; }
  tr.totales td { padding-top: 0.8em; font-weight: bold; }

  .firmas { display: flex; justify-content: space-between; margin-top: {{ g_firmas }}; padding: 0 4mm; }
  .firma { width: 30%; text-align: center; }
  .firma .linea { border-top: 1px solid #1f3a73; margin: 0 4mm 0.3em; height: 1px; }
  .firma .rol { font-weight: bold; }
</style>
{% if auto_print %}<script>window.addEventListener('load', function () { window.print(); });</script>{% endif %}
</head>
<body>
  <div class="voucher">
    <div class="concepto">{{ concepto }}</div>

    <table class="lineas">
      {% for l in lineas %}
      <tr{% if l.es_banco %} class="banco"{% endif %}>
        <td class="cod">{{ l.codigo }}</td>
        <td class="desc">{{ l.descripcion }}</td>
        <td class="num debe">{{ l.debe }}</td>
        <td class="num haber">{{ l.haber }}</td>
      </tr>
      {% endfor %}
      <tr class="totales">
        <td></td><td></td>
        <td class="num debe">{{ total_debe }}</td>
        <td class="num haber">{{ total_haber }}</td>
      </tr>
    </table>

    <div class="firmas">
      <div class="firma"><div class="linea"></div><div class="nombre">{{ elaborado }}</div><div class="rol">Elaborado Por:</div></div>
      <div class="firma"><div class="linea"></div><div class="nombre">{{ revisado }}</div><div class="rol">Revisado Por:</div></div>
      <div class="firma"><div class="linea"></div><div class="nombre">{{ autorizado }}</div><div class="rol">Autorizado Por:</div></div>
    </div>
  </div>
</body>
</html>
