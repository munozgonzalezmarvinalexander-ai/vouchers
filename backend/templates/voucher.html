<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Voucher {{ numero }}</title>
<style>
  /* Hoja carta. Margen 0: controlamos toda la posición con padding/margin en mm,
     para que el voucher caiga en la parte de ABAJO (arriba va el comprobante del banco). */
  @page { size: 216mm 279mm; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1f3a73; font-size: 11px; }

  /* 'top' define dónde empieza el voucher desde el borde superior:
       medio  -> mitad inferior      tercio -> tercio inferior */
  .voucher { padding: 0 18mm; margin-top: {{ top }}; }

  .concepto { text-align: center; line-height: 1.5; margin: 0 0 9mm; padding: 0 6mm; }

  table.lineas { width: 100%; border-collapse: collapse; }
  table.lineas td { padding: 1.5px 0; vertical-align: top; }
  td.cod { width: 20mm; white-space: nowrap; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.debe, td.haber { width: 24mm; }
  tr.banco td { padding-top: 7mm; }
  tr.totales td { padding-top: 6mm; font-weight: bold; }

  .firmas { display: flex; justify-content: space-between; margin-top: 14mm; padding: 0 4mm; }
  .firma { width: 30%; text-align: center; }
  .firma .rol { font-weight: bold; }
  .firma .linea { border-top: 1px solid #1f3a73; margin: 11mm 4mm 2mm; height: 1px; }
</style>
{% if auto_print %}<script>window.addEventListener('load', function () { window.print(); });</script>{% endif %}
</head>
<body>
  <div class="voucher">
    <div class="concepto">{{ concepto }}</div>

    <table class="lineas">
      {% for l in lineas %}
      <tr{% if l.es_banco %} class="banco"{% endif %}>
        <td class="cod">{{ l.codigo }}</td>
        <td class="desc">{{ l.descripcion }}</td>
        <td class="num debe">{{ l.debe }}</td>
        <td class="num haber">{{ l.haber }}</td>
      </tr>
      {% endfor %}
      <tr class="totales">
        <td></td><td></td>
        <td class="num debe">{{ total_debe }}</td>
        <td class="num haber">{{ total_haber }}</td>
      </tr>
    </table>

    <div class="firmas">
      <div class="firma"><div class="rol">Elaborado Por:</div><div class="linea"></div><div class="nombre">{{ elaborado }}</div></div>
      <div class="firma"><div class="rol">Revisado Por:</div><div class="linea"></div><div class="nombre">{{ revisado }}</div></div>
      <div class="firma"><div class="rol">Autorizado Por:</div><div class="linea"></div><div class="nombre">{{ autorizado }}</div></div>
    </div>
  </div>
</body>
</html>
